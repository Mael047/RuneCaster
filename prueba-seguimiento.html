<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUNCASTER – prueba de seguimiento (H1)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0a1a; color: #e8e4ff;
                 font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
    #escenario { position: fixed; inset: 0; display: grid; place-items: center; }
    /* El video y el lienzo se superponen exactamente */
    #marco { position: relative; height: 100vh; aspect-ratio: 4 / 3; max-width: 100vw; }
    video, #trazo { position: absolute; inset: 0; width: 100%; height: 100%; }
    video { transform: scaleX(-1); object-fit: cover; opacity: .55; } /* espejo, atenuado */
    #panel { position: fixed; top: 12px; left: 12px; width: 250px; background: #0009;
             padding: 12px 14px; border-radius: 10px; backdrop-filter: blur(4px); }
    #panel h1 { font-size: 15px; margin: 0 0 8px; }
    #panel label { display: block; margin-top: 10px; }
    #panel input[type=range] { width: 100%; }
    .fila { display: flex; gap: 6px; margin-top: 6px; }
    button { flex: 1; padding: 6px 8px; border: 0; border-radius: 6px; cursor: pointer;
             background: #3a2f6b; color: #fff; font: inherit; }
    button.activo { background: #7b5cff; }
    #stats { margin-top: 10px; font-variant-numeric: tabular-nums; }
    #muestra { display: inline-block; width: 14px; height: 14px; border-radius: 3px;
               vertical-align: middle; border: 1px solid #fff6; }
    .solo-color { display: none; }
    body.modo-color .solo-color { display: block; }
    #inicio { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0a1aee; }
    #inicio div { text-align: center; max-width: 420px; }
    #inicio button { font-size: 18px; padding: 12px 24px; flex: none; }
    #error { color: #ff8080; margin-top: 12px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
      }
    }
  </script>
</head>
<body>
  <div id="escenario">
    <div id="marco">
      <video id="video"></video>
      <canvas id="trazo"></canvas>
    </div>
  </div>

  <div id="panel">
    <h1>Prueba de seguimiento</h1>
    <div class="fila">
      <button id="btn-mano" class="activo">✋ Mano</button>
      <button id="btn-color">🎨 Color</button>
    </div>

    <label>Quitar temblor: <span id="val-suavizado">1.2</span>
      <small>(menor = más suave)</small>
      <input id="suavizado" type="range" min="0.2" max="5" step="0.1" value="1.2" />
    </label>
    <label>Largo del rastro: <span id="val-rastro">25</span>
      <input id="rastro" type="range" min="5" max="80" step="1" value="25" />
    </label>

    <div class="solo-color">
      <label>Color buscado: <span id="muestra"></span>
        <small>(haz clic sobre la bolita en el video)</small></label>
      <label>Tolerancia de tono: <span id="val-tolerancia">20</span>°
        <input id="tolerancia" type="range" min="5" max="60" step="1" value="20" />
      </label>
    </div>

    <div id="stats">
      Detección: <b id="tasa">–</b> de los cuadros<br />
      Velocidad: <b id="fps">–</b> cuadros/s
    </div>
    <div class="fila"><button id="reiniciar">Reiniciar conteo</button></div>
  </div>

  <div id="inicio">
    <div>
      <h2>RUNCASTER · Prueba H1</h2>
      <p>Esta página enciende la cámara y sigue la punta de tu dedo índice
         (o la bolita de la varita en el modo color).</p>
      <button id="empezar">Encender cámara</button>
      <p id="estado"></p>
      <p id="error"></p>
    </div>
  </div>

  <script type="module" src="./src/prueba-seguimiento.js"></script>
</body>
</html>
